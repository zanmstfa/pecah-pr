name: Periksa pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validasi dan build
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Instal dependensi
        run: npm ci

      - name: Validasi data repository
        run: npm run validate:data

      - name: Build website
        run: npm run build